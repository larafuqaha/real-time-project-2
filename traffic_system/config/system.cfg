# ====================================================================
#  Real-Time Traffic Light Control System — runtime configuration
#  ENCS4330 Project #2
#
#  Lines beginning with '#' are comments and are ignored.
#  Format:  KEY = value     (whitespace around '=' is tolerated)
#
#  All times are in WHOLE SECONDS unless otherwise noted.
# ====================================================================

# -------- Phase timing -----------------------------------------------
T_GREEN_MIN            = 8         # minimum green duration (seconds)
T_GREEN_MAX            = 15        # maximum green duration (seconds)
T_YELLOW               = 3         # yellow before red
T_ALL_RED              = 2         # clearance interval (all-red)

# -------- Pedestrian timing ------------------------------------------
T_PEDESTRIAN           = 10        # how long the WALK signal is shown
T_PEDESTRIAN_MAX_WAIT  = 45        # ped never waits more than this

# -------- Vehicle timing ---------------------------------------------
T_VEHICLE_MAX_WAIT     = 60        # vehicle starvation threshold

# -------- Emergency timing -------------------------------------------
T_EMERGENCY_RESPONSE   = 5         # max seconds to start clearing

# -------- Stochastic event generation --------------------------------
# Probability that a NEW vehicle arrives, per direction, per second.
VEHICLE_SPAWN_RATE     = 25        # in percent  (0..100)

# Probability that a pedestrian presses the button per direction/second.
PEDESTRIAN_SPAWN_RATE  = 10        # in percent

# Probability that an emergency vehicle appears, per second (per-mille).
EMERGENCY_SPAWN_RATE   = 5         # in per-thousand  (0..1000)
